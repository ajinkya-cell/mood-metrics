# Scheduled data ingestion. Replaces cron-job.org → /api/cron/*, which broke
# when the site moved hosts (jobs kept calling the old, deleted URL).
# Required repo secrets: DATABASE_URL, NVIDIA_API_KEY, COINGECKO_API_KEY
#
# Alerting: every run starts with an AI model health check. If any job fails
# (model retired, scraper crash, DB down), the `alert` job opens a GitHub issue
# labelled `ingest-alert` — GitHub emails you and pings the mobile app. Further
# failures comment on the same issue; the next fully green run closes it.
name: ingest

on:
  schedule:
    - cron: "5 * * * *"      # flash: hourly
    - cron: "20 */6 * * *"   # reddit: every 6 hours
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [flash, reddit, both]
        default: both

concurrency:
  group: ingest-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

jobs:
  flash:
    if: github.event.schedule == '5 * * * *' || github.event.inputs.job == 'flash' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AI model health check
        run: npx tsx scripts/check-ai-health.ts
      - name: Flash ingestion
        run: npx tsx scripts/cron-flash.ts

  reddit:
    if: github.event.schedule == '20 */6 * * *' || github.event.inputs.job == 'reddit' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AI model health check
        run: npx tsx scripts/check-ai-health.ts
      - name: Reddit ingestion
        run: npx tsx scripts/cron-reddit.ts

  alert:
    needs: [flash, reddit]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = { flash: '${{ needs.flash.result }}', reddit: '${{ needs.reddit.result }}' };
            const failed = Object.entries(results).filter(([, r]) => r === 'failure').map(([j]) => j);
            const ran = Object.values(results).some((r) => r === 'success' || r === 'failure');
            if (!ran) return;

            const label = 'ingest-alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });

            if (failed.length > 0) {
              const body = `Ingestion job(s) **${failed.join(', ')}** failed at ${new Date().toISOString()}.\n\n` +
                `Run log: ${runUrl}\n\n` +
                `If the **AI model health check** step failed, NVIDIA retired or broke the model. Run ` +
                `\`npx tsx --env-file=.env scripts/check-ai-health.ts\` locally, pick a working model from ` +
                `https://integrate.api.nvidia.com/v1/models and update \`SENTIMENT_MODEL\` in \`lib/ai/sentiment.ts\`.`;
              if (open.length > 0) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title: `🚨 Data ingestion failing (${failed.join(', ')})`,
                  body, labels: [label], assignees: [context.repo.owner],
                });
              }
            } else {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `✅ Recovered — ingestion succeeded again: ${runUrl}`,
                });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
              }
            }
